project:
  type: book 

book:
  title: "Learning from Arguments"
  subtitle: "(hacked up version)"
  author: 
    -  "Daniel Z. Korman"
    -  "hacked up by David Sanson"
  chapters:
    - part: Preface
      chapters:
      - index.md
      - preface-students.md
      - preface-instructors.md
    - part: Chapters
      chapters:
      - introduction.md
      - evil.md
      - wager.md
      - personal-identity.md
      - death.md
      - no-freedom.md
      - skepticism.md
      - coercion.md
      - abortion.md
      - eating-animals.md
      - utilitarianism.md
  appendices:
    - logic.md
    - writing.md
    # - theses-and-arguments.md
  page-navigation: true
  #downloads: [epub,pdf]
  repo-url: https://github.com/dsanson/learning-from-arguments-remix
  repo-actions: [issue, source]

bibliography: [references.bib]
citeproc: false
reference-location: section
reference-section-title: References
section-bibliographies:
  cleanup-first: true
  level: 2
  minlevel: 2
  bibliography: [references.bib]

filters:
  - label-bullets.lua
  - custom-callout
  - quarto
  - section-bibliographies

custom-callout:
  argument:
    icon-symbol: "🥊"
    color: "yellow"
    appearance: "minimal"
  example:
    icon-symbol: "💭"
    color: "purple"
    appearance: "minimal"

tbl-cap-location: bottom
crossref:
  tbl-title: Matrix
  tbl-prefix: Matrix
  def-title: T
  def-prefix: T
  custom:
  - caption-location: top
    key: arg
    kind: float
    reference-prefix: "A"
    space-before-numbering: false
  - caption-location: top
    key: exa
    kind: float
    reference-prefix: "TE" 
    space-before-numbering: false

format:
  html:
    format-links: [epub,typst]
    respect-user-color-scheme: true
    theme:
      light: 
        - cosmo
        - custom.scss
      dark: 
        - darkly
        - custom.scss

  epub:
    css: epub.css

  typst:
    citeproc: false
